<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>记忆星图</title>
  <link rel="stylesheet" href="/styles.css">
  <script defer src="/vendor/3d-force-graph.js"></script>
  <script src="/app.js" type="module"></script>
</head>
<body>
  <div class="atlas">
    <main class="stage" aria-label="三维记忆星图">
      <canvas id="sky" aria-hidden="true"></canvas>
      <div id="graph" aria-label="可旋转的记忆星图" aria-describedby="graph-help"></div>
      <span id="marker" class="marker" hidden aria-hidden="true"><i></i></span>
      <header class="masthead">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <div><h1>记忆星图</h1><p>按关键词找回原话</p></div>
        <span class="demo-tag" id="demo-label" hidden>合成演示</span>
      </header>
      <div class="map-empty" id="map-message" hidden role="status"></div>
      <div class="graph-key">
        <div class="scene-count" id="scene-count" role="status">正在读取星图…</div>
        <p id="basis" class="basis" hidden>球面按可回读的账本证据布局</p>
        <p id="graph-help">拖动旋转 · 滚轮或双指缩放 · 点击星点</p>
        <div class="legend" id="legend" aria-label="星点按来源分色"></div>
      </div>
      <div class="controls" role="group" aria-label="镜头控制">
        <button type="button" id="zoom-in" title="放大" aria-label="放大">+</button>
        <button type="button" id="zoom-out" title="缩小" aria-label="缩小">−</button>
        <button type="button" id="reset" class="fit" title="回到全景" aria-label="回到全景"><span aria-hidden="true">⌾</span></button>
        <label class="links"><input id="rotation" type="checkbox">自转</label>
        <label class="links"><input id="links" type="checkbox" checked>证据线</label>
        <label class="links"><input id="all-points" type="checkbox">全部记忆</label>
      </div>
    </main>
    <aside class="dock" aria-label="检索与管理">
      <form id="search" class="search">
        <label for="query">搜索记忆</label>
        <div class="search-input">
          <input id="query" type="search" maxlength="300" autocomplete="off" placeholder="输入关键词、原话或来源引用">
          <button class="primary" type="submit">定位</button>
        </div>
        <div class="filters">
          <select id="mode" aria-label="检索方式"><option value="recall">关键词召回</option><option value="trace">逐字匹配</option></select>
          <select id="source" aria-label="筛选来源"><option value="">全部来源</option></select>
          <label><input id="tools" type="checkbox">工具</label>
        </div>
      </form>
      <p class="feedback" id="message" role="alert" hidden></p>
      <div class="dock-tabs" role="group" aria-label="记录列表">
        <button type="button" class="tab" id="results-tab" aria-pressed="true"><span id="results-label">近期记忆</span></button>
        <button type="button" class="tab" id="saved-tab" aria-pressed="false"><span aria-hidden="true">☆</span> 收藏</button>
        <span id="count" role="status"></span>
      </div>
      <div id="clusters" class="clusters" aria-label="关键词命中星区" hidden></div>
      <div class="dock-body">
        <section class="details" id="details" aria-label="选中记录的原话" hidden>
          <div class="details-top"><p id="detail-source"></p><button type="button" class="close" id="close-detail" aria-label="关闭原话">×</button></div>
          <p id="detail-message" class="detail-message" role="status" hidden></p>
          <pre id="original" tabindex="0"></pre>
          <dl id="metadata"></dl>
          <div class="detail-actions">
            <button type="button" id="favorite" class="primary">收藏</button>
            <button type="button" id="copy">复制引用</button>
            <button type="button" id="focus">重新定位</button>
          </div>
          <div id="related" class="related" hidden><h2>相关记忆</h2><ul id="related-items"></ul></div>
        </section>
        <ul id="items" class="items"></ul>
      </div>
      <footer class="dock-footer">
        <div class="pages" id="pages" hidden>
          <button type="button" id="previous" aria-label="上一页">‹</button><span id="page" role="status"></span><button type="button" id="next" aria-label="下一页">›</button>
        </div>
        <button type="button" id="refresh" class="refresh">刷新账本</button>
      </footer>
    </aside>
  </div>
</body>
</html>
